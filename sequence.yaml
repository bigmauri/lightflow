__manifest__:
  name: "Module 'lightflow'"
  description: |
    This is the sequence where you can define
    a sequence of commands.
  module: "proto.lightflow_pb2"
  requirements:
    - protobuf == v33.0
  tags: ["AUTOMATION"]
commands:
  - &registry_user_catalog
    name: "curl"
    parameters:
       - "-K"
       - "/home/$(whoami)/.docker_registry_auth"
       - "https://registry.home/v2/_catalog"
  - &whoami
    name: "whoami"
    parameters: []
  - &protoc_version
    name: "protoc"
    parameters:
      - "--version"
  - &docker_version
    name: "docker"
    parameters:
      - "--version"
  - &git_version
    name: "git"
    parameters:
      - "--version"
  - &uname
    name: "uname"
    parameters:
      - "-a"
  - &echo
    name: "echo"
    parameters: []
  - &ping_google
    name: "ping"
    parameters:
      - "-c"
      - "3"
      - "8.8.8.8"
  - &traceroute_google
    name: "traceroute"
    parameters:
      - "8.8.8.8"
  - &disk_space_root
    name: "df"
    parameters:
      - "-h"
      - "/"
  - &disk_usage_logs
    name: "du"
    parameters:
      - "-sh"
      - "/var/log"
  - &memory_usage_macos
    name: "top"
    parameters:
      - "-l"
      - "1"
      - "|"
      - "grep"
      - "PhysMem"
  - &cpu_usage_macos
    name: "top"
    parameters:
      - "-l"
      - "1"
      - "|"
      - "grep"
      - "'CPU usage'"
  - &cpu_usage_linux
    name: "top"
    parameters:
      - "-b"
      - "-n"
      - "1"
      - "|"
      - "grep"
      - "'Cpu(s)'"
sequence:
    - name: "[TEST] Lightflow with protobuf v33"
      env: "TEST"
      os: "macOS"
      before_pipeline:
        - name: "pipeline started"
          type: "UNKNOWN"
          before_task:
            - <<: *echo
              parameters:
                  - "STARTED"
            - *protoc_version
            - *docker_version
            - *git_version
          commands:
            - *ping_google
          after_task: []
      tasks:
        - name: "Get server name"
          type: "UNKNOWN"
          before_task:
            - *disk_space_root
            - *cpu_usage_linux
          commands:
            - *whoami
            - *registry_user_catalog
            - *whoami
          after_task:
            - *disk_space_root
            - *cpu_usage_linux
      after_pipeline:
        - name: "pipeline completed"
          type: "UNKNOWN"
          before_task: []
          commands:
            - <<: *echo
              parameters:
                  - "COMPLETED"
          after_task: []
