sequence:
- name: "[TEST] Lightflow with protobuf v33"
  env: "TEST"
  os: "macOS"
  before_pipeline:
    - name: "pipeline started"
      type: "UNKNOWN"
      before_task:
        - <<: *echo
          parameters:
              - "STARTED"
        - *protoc_version
        - *docker_version
        - *git_version
      commands:
        - *ping_google
      after_task: []
  tasks:
    - name: "Get server name"
      type: "UNKNOWN"
      before_task:
        - *disk_space_root
        - *cpu_usage_linux
      commands:
        - *whoami
        - *registry_user_catalog
        - *whoami
      after_task:
        - *disk_space_root
        - *cpu_usage_linux
  after_pipeline:
    - name: "pipeline completed"
      type: "UNKNOWN"
      before_task: []
      commands:
        - <<: *echo
          parameters:
              - "COMPLETED"
      after_task: []
