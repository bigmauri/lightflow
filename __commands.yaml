commands:
  - &registry_user
    name: "USER=$(cut -d':' -f1 ~/.docker_registry_auth)"
    parameters: []
  - &registry_pwd
    name: "PASS=$(cut -d':' -f2 ~/.docker_registry_auth)"
    parameters: []
  - &registry_user_catalog
    name: "curl"
    parameters:
       - "-u"
       - "$USER:$PASS"
       - "https://registry.home/v2/_catalog"
  - &clear
    name: "clear"
    parameters: []
  - &protoc_version
    name: "protoc"
    parameters:
      - "--version"
  - &docker_version
    name: "docker"
    parameters:
      - "--version"
  - &git_version
    name: "git"
    parameters:
      - "--version"
  - &uname
    name: "uname"
    parameters:
      - "-a"
  - &echo
    name: "echo"
    parameters: []
  - &ping_google
    name: "ping"
    parameters:
      - "-c"
      - "3"
      - "8.8.8.8"
  - &ping_cloudflare
    name: "ping"
    parameters:
      - "-c"
      - "3"
      - "1.1.1.1"
  - &curl_google
    name: "curl"
    parameters:
      - "-I"
      - "-s"
      - "-o"
      - "/dev/null"
      - "-w"
      - "%{http_code}"
      - "https://www.google.com"
  - &curl_github
    name: "curl"
    parameters:
      - "-I"
      - "-s"
      - "-o"
      - "/dev/null"
      - "-w"
      - "%{http_code}"
      - "https://www.github.com"
  - &traceroute_google
    name: "traceroute"
    parameters:
      - "8.8.8.8"
  - &nc_google_http
    name: "nc"
    parameters:
      - "-vz"
      - "google.com"
      - "80"
  - &nc_github_https
    name: "nc"
    parameters:
      - "-vz"
      - "github.com"
      - "443"
  - &disk_space_root
    name: "df"
    parameters:
      - "-h"
      - "/"
  - &disk_usage_logs
    name: "du"
    parameters:
      - "-sh"
      - "/var/log"
  - &memory_usage
    name: "top"
    parameters:
      - "-l"
      - "1"
      - "|"
      - "grep"
      - "PhysMem"
  - &cpu_usage
    name: "top"
    parameters:
      - "-l"
      - "1"
      - "|"
      - "grep"
      - "'CPU usage'"
  - &last_syslog_errors
    name: "grep"
    parameters:
      - "error"
      - "/var/log/syslog"
